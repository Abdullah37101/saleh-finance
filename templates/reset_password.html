{% extends "layout.html" %}

{% block title %}
    Reset Password
{% endblock %}

{% block main %}
<main class="d-flex container text-center justify-content-center align-items-center" style="min-height: calc(100vh - 183.2px);"> 
    <form action="/reset-password/{{ token }}" method="post">
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="new_password" placeholder="New Password" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="confirmation" placeholder=" New Password (again)" type="password">
        </div>
        <button class="btn btn-outline-light" type="submit">Reset Password</button>
    </form>
</main>
{% endblock %}
