{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
<main class="d-flex container text-center justify-content-center align-items-center" style="min-height: calc(100vh - 183.2px);">
    <form action="/sell" method="post">
        <div class="mb-3">
            <select class="form-select mx-auto w-auto" name="symbol">
                <option disabled selected>Symbol</option>
                {% for stock in stocks %}
                    <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control mx-auto w-auto" min="0" name="shares" placeholder="Shares" type="number">
        </div>
        <button class="btn btn-outline-light" type="submit">Sell</button>
    </form>
</main>
{% endblock %}
